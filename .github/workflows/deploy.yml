name: Actualizar promos y deploy

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 Argentina
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tests de la lógica pura (cálculo de ahorro, ventana de días, fusión). Node ya viene en el runner.
      - name: Tests
        run: node --test tests/promos.test.cjs

      # Si falla (menos de 1000 promos, error de red o de parseo) el job corta acá:
      # no hay deploy y Pages sigue sirviendo el último JSON bueno.
      - name: Ingesta MODO
        run: python scripts/ingest_modo.py

      # Sin build: se publica solo lo que usa el navegador. data/ lleva promos.json y bancos.json
      # (los usa la app por fetch) y promos.js (mismos datos como script, fallback para file://).
      - name: Armar sitio
        run: |
          test -s data/promos.json && test -s data/bancos.json && test -s data/promos.js
          mkdir -p _site
          cp -r index.html css js assets data design-system _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
